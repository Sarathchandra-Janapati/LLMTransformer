[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-gpt-studio"
version = "0.1.0"
description = "A staged transformer learning studio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = [
    "backend*",
    "transformer_core*",
    "tokenizer*",
    "training*",
    "fine_tuning*",
    "rag*",
    "vector_db*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
